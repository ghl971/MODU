async function importEpubFile(file) {
  const arrayBuffer = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(arrayBuffer);

  // ----- Find OPF (package document) -----
  const containerXml = await zip.file('META-INF/container.xml').async('string');
  const opfMatch = containerXml.match(/full-path="([^"]+)"/);
  if (!opfMatch) throw new Error('无法解析 EPUB 目录结构');
  const opfPath = opfMatch[1];
  const opfBase = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);

  // ----- Parse OPF -----
  const opfXml = await zip.file(opfPath).async('string');
  const opfDoc = new DOMParser().parseFromString(opfXml, 'text/xml');

  // Get metadata
  const getMeta = (tag) => {
    const el = opfDoc.querySelector(`metadata > ${tag}`);
    return el ? el.textContent.trim() : '';
  };
  let title = getMeta('title') || file.name.replace(/\.epub$/i, '').trim();
  let author = getMeta('creator') || '未知作者';

  // Build manifest map
  const manifest = {};
  opfDoc.querySelectorAll('manifest > item').forEach(item => {
    manifest[item.getAttribute('id')] = item.getAttribute('href');
  });

  // Build spine order (skip non-linear items)
  const spineItems = [];
  opfDoc.querySelectorAll('spine > itemref').forEach(ref => {
    const idref = ref.getAttribute('idref');
    const linear = ref.getAttribute('linear');
    if (linear === 'no') return;
    if (manifest[idref]) spineItems.push({ idref, href: manifest[idref] });
  });

  if (spineItems.length === 0) throw new Error('EPUB 文件没有可读内容');

  // ----- Read each spine item and extract text -----
  const chapters = [];
  for (const item of spineItems) {
    const fullPath = (opfBase + item.href).replace(/\/\//g, '/');
    const entry = zip.file(fullPath);
    if (!entry) continue;

    let raw = await entry.async('string');

    // Wrap in a full document if it's a fragment
    if (!raw.includes('<html') && !raw.includes('<body')) {
      raw = `<html><body>${raw}</body></html>`;
    }

    const doc = new DOMParser().parseFromString(raw, 'text/html');
    const body = doc.body;
    if (!body) continue;

    // Remove script/style
    body.querySelectorAll('script, style, nav').forEach(el => el.remove());

    // Extract chapter title: <h1> or <h2> or <title>
    let chTitle = '';
    const h1 = body.querySelector('h1');
    const h2 = body.querySelector('h2');
    const htmlTitle = doc.querySelector('title');
    if (h1) chTitle = h1.textContent.trim();
    else if (h2) chTitle = h2.textContent.trim();
    else if (htmlTitle) chTitle = htmlTitle.textContent.trim();

    if (!chTitle) chTitle = `第 ${chapters.length + 1} 章`;

    // Extract and clean text
    let text = body.textContent || '';
    text = text.replace(/\s+/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    if (!text) continue;

    chapters.push({ title: chTitle, content: text });
  }

  if (chapters.length === 0) throw new Error('未能从 EPUB 中提取到文本内容');

  // ----- Create book entry -----
  const colors = [
    'linear-gradient(135deg, #1E3A5F, #3B82F6, #60A5FA)',
    'linear-gradient(135deg, #5B2333, #9F2B4E, #E85D75)',
    'linear-gradient(135deg, #1A3A2A, #2D6A4F, #52B788)',
    'linear-gradient(135deg, #3D1C02, #7C3F00, #D97706)',
    'linear-gradient(135deg, #2D1B69, #6D28D9, #A78BFA)',
    'linear-gradient(135deg, #3F2812, #7C5C3A, #B8915C)',
  ];
  const colorIdx = title.split('').reduce((s, c) => s + c.charCodeAt(0), 0) % colors.length;
  const id = 'epub_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

  const book = {
    id, title, author,
    coverColor: colors[colorIdx],
    description: `从 EPUB 文件导入：「${file.name}」\n共 ${chapters.length} 个章节`,
    chapters
  };

  state.books.push(book);
  state.importedBookIds.add(id);
  saveAll();
  selectBook(book);
  showToast(`「${title}」导入成功（${chapters.length} 章）`, 'success');
}

// ============================================================
// PARAGRAPH SPLITTING — smart detection for mixed formats
// ============================================================
function smartSplitParagraphs(text) {
  let t = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  // Normalize "whitespace-only lines" → blank lines
  t = t.replace(/^[ 　\t]+$/gm, '');

  // Try blank-line separated paragraphs first
  let paragraphs = t.split(/\n\n+/).map(p => p.trim()).filter(Boolean);

  // If only 1 paragraph but lots of lines, each non-empty line is a paragraph
  if (paragraphs.length <= 1) {
    const lines = t.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length > 3) paragraphs = lines;
  }

  return paragraphs.length > 0 ? paragraphs : [t.trim()];
}

// ============================================================
// INIT
// ============================================================
async function init() {
  await loadSavedData();
  loadTheme();
  loadSettings();
  renderLibrary();

  // Auto-restore last read
  const ids = Object.keys(state.progress);
  if (ids.length > 0) {
    const lastId = ids[ids.length - 1];
    const book = state.books.find(b => b.id === lastId);
    if (book) { selectBook(book); return; }
  }

  readingControls.classList.remove('visible');
}

init();
</script>
